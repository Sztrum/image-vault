services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: image_vault
            MYSQL_USER: image_vault
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-uimage_vault"]
            interval: 5s
            timeout: 5s
            retries: 20

    backend:
        build: ./backend
        env_file: ./backend/.env
        environment:
            DB_HOST: mysql
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy

    frontend:
        build: ./frontend
        env_file: ./frontend/.env
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend

volumes:
    mysql-data:
